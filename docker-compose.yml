version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geosentinel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount model weights and runs data directory
      - ./model:/app/model
      # Mount local Earth Engine credentials for authentication
      - ${USERPROFILE}/.config/earthengine:/root/.config/earthengine:ro
    environment:
      - PYTHONUNBUFFERED=1
      - GEE_PROJECT_ID=geosentinel-ai-511016
    networks:
      - geosentinel-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geosentinel-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - geosentinel-net

networks:
  geosentinel-net:
    driver: bridge